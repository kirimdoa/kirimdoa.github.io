<script>
/**
 * KD.api — SATU-SATUNYA lapisan komunikasi dengan backend (google.script.run → api()).
 * Frontend tidak pernah mengakses perkhidmatan Google secara terus atau menyimpan rahsia.
 */
(function (KD) {
  'use strict';

  class ApiError extends Error {
    constructor(message, code, meta) { super(message); this.code = code; this.meta = meta || {}; }
  }

  /*
   * Cuba semula jika sambungan gagal: Google kadangkala tidak menghantar jawapan (HTTP 404 pada URL echo, tamat masa)
   * walaupun skrip telah berjalan. Setiap tindakan membawa meta.rid yang sama merentas cubaan, dan pelayan
   * (Router.dispatch) memulangkan jawapan asal untuk rid yang telah diproses — jadi tulisan juga selamat diulang.
   */
  const RETRY_MS = [500, 1500, 3000];
  const newRid = () => (KD.utils && KD.utils.requestId ? KD.utils.requestId() : 'r' + String(Date.now()) + Math.random().toString(36).slice(2, 12));

  function once(action, payload, rid, attempt) {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) {
        reject(new ApiError('Aplikasi mesti dibuka melalui pautan Web App.', 'NO_RUNTIME'));
        return;
      }
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success) return resolve(res.data);
          const err = new ApiError((res && res.message) || 'Permintaan tidak dapat diproses.', res && res.code, res && res.meta);
          if (err.code === 'UNAUTHENTICATED' && KD.auth && KD.auth.token() && action !== 'auth.login') KD.auth.expired();
          if (err.code === 'MAINTENANCE' && KD.app) KD.app.maintenance(err.message);
          reject(err);
        })
        .withFailureHandler((e) => {
          console.error('[api]', action, 'cubaan ' + (attempt + 1), e);
          const detail = String((e && e.message) || e || '').slice(0, 60);
          reject(new ApiError('Sambungan ke pelayan gagal. Semak internet anda dan cuba semula.' + (detail ? ' (' + detail + ')' : ''), 'NETWORK', { detail: detail }));
        })
        .api({ action: action, payload: payload || {}, token: KD.auth ? KD.auth.token() : '', meta: { userAgent: navigator.userAgent, rid: rid, attempt: attempt || 0 } });
    });
  }

  async function call(action, payload) {
    const rid = newRid();
    for (let i = 0; ; i++) {
      try { return await once(action, payload, rid, i); } catch (err) {
        if (err.code !== 'NETWORK' || i >= RETRY_MS.length) throw err;
        await new Promise((r) => setTimeout(r, RETRY_MS[i]));
      }
    }
  }

  /*
   * Cache pelayar (1.9.0): jawapan bacaan disimpan per pengguna dalam localStorage. swr() memaparkan data
   * tersimpan SERTA-MERTA, kemudian mengemas kini daripada pelayan. Jika luar talian, data tersimpan kekal dipaparkan.
   * Dipadam apabila log keluar (KD.auth.clear). Tiada token / kata laluan disimpan di sini.
   */
  const CACHE_PREFIX = 'kd.c1.';
  const QUEUE_KEY = 'kd.q1';
  const userKey = () => { const u = KD.auth && KD.auth.user && KD.auth.user(); return (u && u.id) || 'anon'; };
  const ckey = (action, payload) => CACHE_PREFIX + userKey() + '.' + action + '.' + JSON.stringify(payload || {});
  function cacheGet(action, payload) {
    try { const r = JSON.parse(localStorage.getItem(ckey(action, payload)) || 'null'); return r && r.t ? r : null; } catch (e) { return null; }
  }
  function cacheClear() {
    try {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && (k.indexOf(CACHE_PREFIX) === 0 || k === QUEUE_KEY)) keys.push(k); }
      keys.forEach((k) => localStorage.removeItem(k));
    } catch (e) { /* abaikan */ }
  }
  function cacheSet(action, payload, data) {
    const v = JSON.stringify({ t: Date.now(), d: data });
    try { localStorage.setItem(ckey(action, payload), v); } catch (e) {
      try { cacheClear(); localStorage.setItem(ckey(action, payload), v); } catch (e2) { /* storan penuh / mod peribadi */ }
    }
  }
  let offlineToastAt = 0;
  function noteOffline(at) {
    if (Date.now() - offlineToastAt < 60000) return;
    offlineToastAt = Date.now();
    if (KD.ui && KD.ui.toast) KD.ui.toast('Luar talian: memaparkan data tersimpan' + (at && KD.utils ? ' (' + KD.utils.relTime(new Date(at).toISOString()) + ')' : '') + '.');
  }

  /**
   * Papar data tersimpan dahulu, kemudian data terkini. render(data, {stale, offline}) mungkin dipanggil dua kali.
   * @return {Promise<*>} data terkini (atau tersimpan jika luar talian)
   */
  async function swr(action, payload, render) {
    const hit = cacheGet(action, payload);
    if (hit) { try { render(hit.d, { stale: true }); } catch (e) { console.error(e); } }
    try {
      const d = await call(action, payload);
      cacheSet(action, payload, d);
      if (!hit || JSON.stringify(hit.d) !== JSON.stringify(d)) render(d, { stale: false });
      return d;
    } catch (err) {
      if (hit && err.code === 'NETWORK') { noteOffline(hit.t); return hit.d; }
      throw err;
    }
  }

  /** Kemas kini cache selepas perubahan setempat (cth. tanda senarai semak) supaya paparan seterusnya tepat. */
  function cachePatch(action, payload, fn) {
    const hit = cacheGet(action, payload);
    if (!hit) return;
    try { const d = fn(hit.d); if (d !== undefined) cacheSet(action, payload, d); } catch (e) { /* abaikan */ }
  }

  /* Baris gilir tulisan luar talian (hanya tindakan idempoten: tanda senarai semak). Dihantar apabila kembali dalam talian. */
  const QUEUEABLE = ['umrah.semak.toggle', 'doa.markPrayed'];
  function queueGet() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
  function queueSave(q) { try { if (q.length) localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); else localStorage.removeItem(QUEUE_KEY); } catch (e) { /* abaikan */ } }
  /** Seperti call(), tetapi jika luar talian tindakan disimpan dan dihantar kemudian. @return {{queued:boolean, data:*}} */
  async function callOrQueue(action, payload) {
    try { return { queued: false, data: await call(action, payload) }; } catch (err) {
      if (err.code !== 'NETWORK' || QUEUEABLE.indexOf(action) < 0) throw err;
      const q = queueGet().filter((x) => !(x.action === action && x.payload && payload && x.payload.id === payload.id));
      q.push({ action, payload, user: userKey(), t: Date.now() });
      queueSave(q);
      return { queued: true, data: null };
    }
  }
  let flushing = false;
  async function flushQueue() {
    if (flushing || !(KD.auth && KD.auth.loggedIn && KD.auth.loggedIn())) return 0;
    flushing = true;
    let sent = 0;
    try {
      let q = queueGet();
      while (q.length) {
        const item = q[0];
        if (item.user !== userKey()) { q.shift(); continue; }
        try { await call(item.action, item.payload); sent++; q.shift(); } catch (err) { if (err.code === 'NETWORK') break; q.shift(); }
        queueSave(q);
      }
      queueSave(q);
    } finally { flushing = false; }
    if (sent && KD.ui) KD.ui.toast(sent + ' perubahan luar talian telah disegerakkan.');
    return sent;
  }
  const queueSize = () => queueGet().length;

  /** Tindih "telah dibacakan" yang masih beratur pada senarai doa (cache atau terkini). */
  function overlayDoas(d) {
    const ids = queueGet().filter((x) => x.action === 'doa.markPrayed' && x.user === userKey()).map((x) => x.payload.id);
    if (!ids.length || !d || !d.items) return d;
    return Object.assign({}, d, { items: d.items.map((x) => (ids.indexOf(x.id) >= 0 ? Object.assign({}, x, { isPrayed: true, canMarkPrayed: false, prayedQueued: true, prayedAt: x.prayedAt || new Date().toISOString() }) : x)) });
  }

  /** Rangkaian dahulu; jika luar talian, guna salinan tersimpan (cth. senarai doa untuk mod baca di Tanah Suci). */
  async function callCached(action, payload) {
    try {
      const d = await call(action, payload);
      cacheSet(action, payload, d);
      return action === 'doa.list' ? overlayDoas(d) : d;
    } catch (err) {
      const hit = err.code === 'NETWORK' ? cacheGet(action, payload) : null;
      if (!hit) throw err;
      noteOffline(hit.t);
      return action === 'doa.list' ? overlayDoas(hit.d) : hit.d;
    }
  }
  window.addEventListener('online', () => { flushQueue(); });

  KD.api = {
    call,
    swr,
    cacheGet,
    cacheSet,
    cachePatch,
    cacheClear,
    callOrQueue,
    flushQueue,
    queueSize,
    queueItems: () => queueGet(),
    callCached,
    getHome: () => call('user.home'),
    ApiError,
    // Awam
    getConfig: () => call('public.config'),
    getCategories: () => call('public.categories'),
    sendFeedback: (p) => call('public.feedback', p),
    // Auth
    register: (p) => call('auth.register', p),
    login: (p) => call('auth.login', p),
    logout: () => call('auth.logout'),
    getCurrentUser: () => call('auth.me'),
    changePassword: (p) => call('auth.changePassword', p),
    requestReset: (p) => call('auth.requestReset', p),
    resetPassword: (p) => call('auth.resetPassword', p),
    // Pengguna
    updateProfile: (p) => call('user.updateProfile', p),
    getDashboard: () => call('user.dashboard'),
    // Doa
    getDoas: (filters) => callCached('doa.list', filters),
    getDoa: (id) => call('doa.get', { id }),
    createDoa: (p) => call('doa.create', p),
    updateDoa: (id, p) => call('doa.update', Object.assign({ id }, p)),
    deleteDoa: (id) => call('doa.delete', { id }),
    favoriteDoa: (id) => call('doa.favorite', { id }),
    markRead: (ids) => call('doa.markRead', { ids }),
    markPrayed: (id) => call('doa.markPrayed', { id }),
    // Notifikasi telefon
    pushStatus: () => call('push.status'),
    pushRegister: (p) => call('push.register', p),
    pushUnregister: (p) => call('push.unregister', p),
    pushTest: () => call('push.test'),
    getAttachment: (id) => call('doa.attachment', { id }),
    exportPdf: (filters) => call('export.pdf', filters),
    // Kumpul Doa
    getMyLinks: () => call('recipient.mine'),
    createLink: (p) => call('recipient.create', p),
    updateLink: (p) => call('recipient.update', p),
    getPublicLink: (code) => call('recipient.public', { code }),
    submitToLink: (p) => call('recipient.submit', p),
    // Notifikasi
    getNotifications: (p) => call('notification.list', p),
    markNotificationRead: (id) => call('notification.markRead', { id }),
    markAllNotificationsRead: () => call('notification.markAllRead'),
    // Admin
    admin: {
      getStatistics: () => call('admin.stats'),
      getReport: (p) => call('admin.report', p),
      getUsers: (f) => call('admin.users', f),
      setUserStatus: (p) => call('admin.user.status', p),
      setUserRole: (p) => call('admin.user.role', p),
      revokeSessions: (userId) => call('admin.user.revokeSessions', { userId }),
      sendReset: (userId) => call('admin.user.sendReset', { userId }),
      getDoas: (f) => call('admin.doas', f),
      setDoaStatus: (p) => call('admin.doa.status', p),
      getCategories: () => call('admin.categories'),
      createCategory: (p) => call('admin.category.create', p),
      updateCategory: (p) => call('admin.category.update', p),
      broadcast: (p) => call('admin.broadcast', p),
      getBroadcasts: () => call('admin.broadcastHistory'),
      getAuditLogs: (f) => call('admin.audit', f),
      getFeedback: (f) => call('admin.feedback', f),
      setFeedbackStatus: (p) => call('admin.feedback.status', p),
      getSettings: () => call('admin.settings'),
      updateSettings: (changes) => call('admin.settings.update', { changes }),
      getHealth: () => call('admin.health'),
      runBackup: () => call('admin.backup'),
      getMigrations: () => call('admin.migrations'),
      getSystemLogs: () => call('admin.systemLogs')
    }
  };
})(window.KD);
</script>
