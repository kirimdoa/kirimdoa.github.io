<style>
/* Planner Umrah (1.7.0) */
.um-tabs { margin-bottom: var(--sp-5); max-width: 100%; }
.um-stack { display: flex; flex-direction: column; gap: var(--sp-4); }
.um-trip { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; padding: var(--sp-4) var(--sp-5); }
.um-trip > .i { width: 28px; height: 28px; color: var(--gold); flex: 0 0 auto; }
.um-trip__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.um-trip__label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.um-trip__date { font-weight: 700; color: var(--maroon-900); font-size: var(--fs-lg); }
.um-trip__count { font-size: var(--fs-sm); color: var(--maroon); font-weight: 600; font-variant-numeric: tabular-nums; }
.um-trip__count .i { display: inline-block; vertical-align: -2px; width: 15px; height: 15px; }
@media (max-width: 720px) { .um-trip { padding: var(--sp-3) var(--sp-4); gap: var(--sp-3); } }
.um-remind { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--sp-3); border-top: 1px solid var(--line); padding-top: var(--sp-3); }
.um-remind .check { flex: 1 1 260px; min-width: 0; }
.um-remind .check b { display: block; color: var(--maroon-900); }
.um-remind__push { font-size: var(--fs-xs); color: var(--success); font-weight: 600; }
.um-trip.is-unset .um-trip__date { color: var(--muted); font-weight: 600; font-size: var(--fs-md); }
.um-hero { display: flex; align-items: center; gap: var(--sp-5); flex-wrap: wrap; }
.um-hero__pct { font-family: var(--font-display); font-size: var(--fs-3xl); color: var(--maroon); line-height: 1; font-variant-numeric: tabular-nums; }
.um-hero__body { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: var(--sp-2); }
.um-track { height: 8px; background: var(--maroon-50); border-radius: var(--r-pill); overflow: hidden; }
.um-track span { display: block; height: 100%; background: linear-gradient(90deg, var(--maroon), var(--gold)); border-radius: var(--r-pill); transition: width .25s; }
.um-group { padding: 0; overflow: hidden; }
.um-group__head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5) var(--sp-3); border-bottom: 1px solid var(--line); }
.um-group__head h3 { margin: 0; font-size: var(--fs-md); font-family: var(--font-ui); font-weight: 700; color: var(--maroon-900); }
.um-count { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.um-row { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); }
.um-row:first-child { border-top: 0; }
.um-row input[type=checkbox] { flex: 0 0 22px; width: 22px; height: 22px; margin-top: 2px; accent-color: var(--maroon); cursor: pointer; }
.um-row__body { flex: 1; min-width: 0; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.um-row__title { font-weight: 600; overflow-wrap: anywhere; }
.um-row__note { font-size: var(--fs-sm); color: var(--muted); overflow-wrap: anywhere; }
.um-row__date { font-size: var(--fs-xs); color: var(--warn); font-weight: 600; }
.um-row__date.is-today { color: var(--maroon); }
.um-row.is-done .um-row__title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--gold); }
.um-row .icon-btn { flex: 0 0 auto; }
.um-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); }
.um-sum .stat { min-width: 0; }
.um-sum .stat__value { font-variant-numeric: tabular-nums; }
.um-day { padding: 0; overflow: hidden; }
.um-day__head { display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5); background: var(--cream); border-bottom: 1px solid var(--line); }
.um-day__head h3 { margin: 0; font-size: var(--fs-md); font-family: var(--font-ui); font-weight: 700; }
.um-day.is-today { border-color: var(--maroon); box-shadow: 0 0 0 1px var(--maroon); }
.um-act { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: var(--sp-3); padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); align-items: start; }
.um-act:first-child { border-top: 0; }
.um-act__time { font-weight: 700; color: var(--maroon); font-variant-numeric: tabular-nums; }
.um-act__title { font-weight: 600; overflow-wrap: anywhere; }
.um-act__meta { font-size: var(--fs-sm); color: var(--muted); overflow-wrap: anywhere; }
.um-exp { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-5); border-top: 1px solid var(--line); }
.um-exp:first-child { border-top: 0; }
.um-exp__amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.um-exp__rm { display: block; font-size: var(--fs-xs); color: var(--muted); font-weight: 500; }
.um-ar { font-family: var(--font-arabic); font-size: 1.55rem; line-height: 2; direction: rtl; text-align: right; margin: 0; color: var(--maroon-900); }
.um-rumi { font-style: italic; color: var(--muted); margin: 0; }
.um-steps { display: flex; flex-direction: column; gap: var(--sp-4); margin: 0; padding: 0; list-style: none; counter-reset: s; }
.um-steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: var(--sp-3); align-items: start; }
.um-steps li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; background: var(--maroon); color: var(--gold-200); display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); }
.um-steps b { display: block; color: var(--maroon-900); }
.um-list { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: var(--sp-1); }
.um-start { display: flex; flex-direction: column; gap: var(--sp-4); max-width: 560px; }
.um-start .row { align-items: flex-end; }
.um-titipan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
.um-titipan a { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--white); text-decoration: none; color: var(--maroon-900); font-weight: 600; }
.um-titipan a:hover { border-color: var(--maroon); }
.um-titipan a .i { width: 26px; height: 26px; color: var(--purple); }
.um-titipan small { font-weight: 400; color: var(--muted); }
.um-dash { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.um-dash > .i { width: 36px; height: 36px; color: var(--maroon); }
.um-dash__body { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: var(--sp-2); }
/* Kaunter Tawaf & Sa'ie */
.um-ktr { display: flex; flex-direction: column; align-items: center; gap: var(--sp-4); text-align: center; }
.um-ktr__btn { width: min(260px, 70vw); aspect-ratio: 1; max-width: 100%; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; touch-action: manipulation;
  background: radial-gradient(circle at center, var(--white) 0 60%, transparent 61%), conic-gradient(var(--maroon) calc(var(--p) * 1%), var(--maroon-50) 0); box-shadow: var(--shadow-lift); }
.um-ktr__btn:active { transform: scale(.98); }
.um-ktr__btn:focus-visible { outline: none; box-shadow: var(--focus), var(--shadow-lift); }
.um-ktr__num { font-family: var(--font-display); font-size: clamp(3rem, 16vw, 4.5rem); color: var(--maroon); line-height: 1; font-variant-numeric: tabular-nums; }
.um-ktr__sub { display: block; font-size: var(--fs-sm); color: var(--muted); margin-top: var(--sp-2); }
.um-ktr__dir { font-weight: 700; color: var(--maroon-900); font-size: var(--fs-lg); }
.um-ktr__done { border: 1px solid var(--success); background: var(--success-50); }
.um-ktr .row { justify-content: center; }
.um-doa { text-align: left; width: 100%; display: flex; flex-direction: column; gap: var(--sp-2); }
.um-doa .um-ar { font-size: 1.35rem; }
/* Kad penting */
.um-kad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
.um-kad section { min-width: 0; }
.um-kad h3 { font-size: var(--fs-md); font-family: var(--font-ui); font-weight: 700; color: var(--maroon-900); margin: 0 0 var(--sp-3); display: flex; gap: var(--sp-2); align-items: center; }
.um-kv { display: grid; grid-template-columns: minmax(90px, 38%) minmax(0, 1fr); gap: var(--sp-2) var(--sp-3); margin: 0; }
.um-kv dt { color: var(--muted); font-size: var(--fs-sm); }
.um-kv:empty::before { content: 'Belum diisi'; grid-column: 1 / -1; color: var(--muted); font-size: var(--fs-sm); }
.um-note .i { display: inline-block; vertical-align: -2px; width: 14px; height: 14px; }
.um-kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.um-kv a { color: var(--maroon); }
.um-big-ar { font-family: var(--font-arabic); direction: rtl; text-align: center; font-size: clamp(1.8rem, 8vw, 3rem); line-height: 1.7; color: var(--ink); overflow-wrap: anywhere; }
.um-sos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2); }
.um-sos a { display: flex; flex-direction: column; align-items: center; padding: var(--sp-3) var(--sp-2); border-radius: var(--r-md); border: 1px solid var(--line); text-decoration: none; color: var(--ink); background: var(--white); }
.um-sos b { font-size: var(--fs-xl); color: var(--danger); font-variant-numeric: tabular-nums; }
.um-sos span { font-size: var(--fs-xs); color: var(--muted); text-align: center; }
.um-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--sp-4); }
.um-form-grid .field { min-width: 0; }
.um-form-grid h4 { grid-column: 1 / -1; margin: var(--sp-4) 0 var(--sp-2); color: var(--maroon-900); font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: .06em; }
.um-form-grid .span2 { grid-column: 1 / -1; }
@media (max-width: 720px) {
  .um-kad, .um-form-grid { grid-template-columns: 1fr; }
  .um-sos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .um-sum { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
  .um-sum > :first-child { grid-column: 1 / -1; }
  .um-sum .stat:not(:first-child) .stat__value { font-size: var(--fs-lg); }
  .um-titipan { grid-template-columns: 1fr; }
  .um-row, .um-act, .um-exp, .um-group__head, .um-day__head { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .um-tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; }
  .um-tabs button { flex: 0 0 auto; }
}
</style>
<script>
/**
 * Planner Umrah: Senarai Semak, Perbelanjaan, Jadual & Ziarah, Titipan Doa (guna Kumpul Doa), Panduan.
 * Satu laluan #/umrah?tab=… supaya semua dalam satu tempat.
 * NOTA Apps Script: jangan tulis dua garis condong dalam skrip ini.
 */
(function (KD) {
  'use strict';
  const { html, raw, qs, on, formData, fmtNum, fmtDate, todayKey } = KD.utils;
  const { icon, toast, toastError, modal, confirm, skeletonList, empty, errorState, busy, fieldErrors } = KD.ui;
  const call = KD.api.call;

  const TABS = [['semak', 'list', 'Senarai Semak'], ['kaunter', 'kaaba', 'Kaunter Tawaf'], ['kad', 'shield', 'Kad Penting'], ['belanja', 'coins', 'Perbelanjaan'], ['jadual', 'calendar', 'Jadual'], ['titipan', 'hands', 'Titipan Doa'], ['panduan', 'book', 'Panduan']];
  const FASA = [['SEBELUM', 'Sebelum'], ['SEMASA', 'Semasa'], ['SELEPAS', 'Selepas']];
  const KUMPULAN = [['DOKUMEN', 'Dokumen & urusan rasmi'], ['KEWANGAN', 'Kewangan'], ['ROHANI', 'Ilmu & persiapan rohani'], ['KESIHATAN', 'Kesihatan'],
    ['BARANG', 'Barang bawaan'], ['BERLEPAS', 'Hari berlepas'], ['MIQAT', 'Penerbangan & miqat'], ['IBADAH', 'Ibadah Umrah'], ['MAKKAH', 'Di Makkah'],
    ['MADINAH', 'Di Madinah'], ['JAGADIRI', 'Jaga diri'], ['PULANG', 'Sebelum pulang'], ['TIBA', 'Tiba di tanah air'], ['AMALAN', 'Kekalkan amalan'], ['LAIN', 'Lain-lain']];
  const KATEGORI = [['MAKAN', 'Makan & minum'], ['PENGANGKUTAN', 'Pengangkutan'], ['OLEOLE', 'Ole-ole'], ['DAM', 'Dam / fidyah'], ['SEDEKAH', 'Sedekah & infaq'], ['PAKEJ', 'Pakej & persiapan'], ['LAIN', 'Lain-lain']];
  const LOKASI = [['MAKKAH', 'Makkah'], ['MADINAH', 'Madinah'], ['MALAYSIA', 'Malaysia'], ['PERJALANAN', 'Dalam perjalanan'], ['LAIN', 'Lain-lain']];
  const JENIS = [['IBADAH', 'Ibadah'], ['ZIARAH', 'Ziarah'], ['PERJALANAN', 'Perjalanan'], ['HOTEL', 'Hotel'], ['MAKAN', 'Makan'], ['LAIN', 'Lain-lain']];
  /** Hari dari hari ini ke tarikh (YYYY-MM-DD). */
  const daysTo = (key) => Math.round((new Date(key + 'T00:00:00Z') - new Date(todayKey() + 'T00:00:00Z')) / 86400000);
  const countdown = (key) => { const n = daysTo(key); return n > 1 ? n + ' hari lagi' : n === 1 ? 'Esok' : n === 0 ? 'Hari ini, selamat berangkat' : 'Hari ke-' + (1 - n) + ' perjalanan'; };
  const label = (list, v) => (list.filter((x) => x[0] === v)[0] || [v, v || ''])[1];
  const money = (n, cur) => cur + ' ' + Number(n || 0).toLocaleString('ms-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const options = (list, v) => list.map((o) => html`<option value="${o[0]}" ${o[0] === v ? raw('selected') : ''}>${o[1]}</option>`);
  const field = (id, lbl, input, req, hint) => html`<div class="field"><label class="label" for="${id}">${lbl}${req ? html` <span class="req">*</span>` : ''}</label>${input}${hint ? html`<span class="hint">${hint}</span>` : ''}</div>`;

  /** Borang dalam modal: simpan → call(action, data) → reload. */
  function openForm(opts) {
    const m = modal({ title: opts.title, body: html`<form novalidate>${opts.body}</form>`,
      foot: html`${opts.id ? html`<button class="btn btn-ghost" data-act="del" style="margin-right:auto">${icon('trash', 'i-sm')}Padam</button>` : ''}<button class="btn btn-outline" data-close>Batal</button><button class="btn btn-primary" data-act="save">Simpan</button>` });
    const form = qs('form', m.el);
    form.addEventListener('submit', (e) => e.preventDefault());
    on(m.el, 'click', '[data-act="save"]', (e, b) => busy(b, async () => {
      const data = formData(form);
      if (opts.id) data.id = opts.id;
      try { await call(opts.action, data); m.close(); toast('Disimpan.'); opts.done(); } catch (err) { if (!fieldErrors(form, err)) toastError(err); }
    }));
    on(m.el, 'click', '[data-act="del"]', async () => {
      m.close();
      if (!(await confirm({ title: 'Padam rekod?', message: 'Rekod ini akan dipadam terus.', confirmText: 'Padam', danger: true }))) return;
      try { await call(opts.delAction, { id: opts.id }); toast('Dipadam.'); opts.done(); } catch (err) { toastError(err); }
    });
  }

  /* ---- Senarai semak ---- */
  /** Tindih tanda yang masih dalam baris gilir luar talian (belum sampai ke pelayan). */
  function withQueued(d) {
    const q = (KD.api.queueItems ? KD.api.queueItems() : []).filter((x) => x.action === 'umrah.semak.toggle');
    if (!q.length || !d || !d.items) return d;
    const copy = Object.assign({}, d, { items: d.items.map((i) => Object.assign({}, i)) });
    q.forEach((x) => { const it = copy.items.filter((i) => i.id === x.payload.id)[0]; if (it) it.done = !!x.payload.done; });
    copy.done = copy.items.filter((i) => i.done).length;
    return copy;
  }
  const saveSemakCache = (d) => { if (d && d.items) KD.api.cacheSet('umrah.semak.list', {}, d); };

  async function semak(box, query) {
    let data = null;
    let fasa = query.fasa || '';
    const draw = () => {
      const items = data.items;
      if (!items.length) {
        box.innerHTML = html`<section class="panel"><div class="um-start">
          <div><h3>Mulakan senarai semak Umrah</h3><p class="muted mt-2">Lebih 50 perkara persiapan, dari dokumen hingga amalan selepas pulang. Masukkan tarikh berlepas untuk tarikh sasaran automatik.</p></div>
          <div class="row row-wrap"><div class="field grow" style="margin:0"><label class="label" for="um-berlepas">Tarikh berlepas (pilihan)</label><input class="input" type="date" id="um-berlepas"></div>
          <button class="btn btn-primary" data-act="seed">${icon('sparkle')}Jana senarai semak</button></div>
          <p class="small muted">Atau <a href="#" data-act="add">tambah item sendiri</a>.</p></div></section>`.s;
        return;
      }
      if (!fasa) { const open = FASA.filter((f) => items.some((i) => i.fasa === f[0] && !i.done))[0]; fasa = open ? open[0] : 'SEBELUM'; }
      const pct = Math.round((100 * data.done) / items.length);
      const today = todayKey();
      const inFasa = items.filter((i) => i.fasa === fasa);
      const groups = KUMPULAN.map((k) => [k, inFasa.filter((i) => i.kumpulan === k[0])]).filter((g) => g[1].length);
      const dep = data.tarikhBerlepas;
      box.innerHTML = html`<div class="um-stack">
        <section class="panel um-trip ${dep ? '' : 'is-unset'}">${icon('plane')}
          <div class="um-trip__body"><span class="um-trip__label">Tarikh berlepas</span>
            ${dep ? html`<span class="um-trip__date" data-berlepas>${fmtDate(dep)}</span><span class="um-trip__count">${countdown(dep)}</span>`
              : html`<span class="um-trip__date">Belum ditetapkan</span><span class="small muted">Tetapkan untuk tarikh sasaran automatik.</span>`}</div>
          <button class="btn ${dep ? 'btn-outline' : 'btn-primary'} btn-sm" data-act="berlepas">${icon(dep ? 'edit' : 'calendar', 'i-sm')}${dep ? 'Ubah' : 'Tetapkan'}</button>
          ${dep ? remindRow() : ''}</section>
        <section class="panel um-hero"><div class="um-hero__pct">${pct}%</div><div class="um-hero__body"><strong>${fmtNum(data.done)} daripada ${fmtNum(items.length)} perkara siap</strong>
          <div class="um-track" role="progressbar" aria-label="Kemajuan persiapan" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div></div>
          <button class="btn btn-outline btn-sm" data-act="add">${icon('plus', 'i-sm')}Tambah item</button></section>
        <div class="segmented" role="group" aria-label="Fasa">${FASA.map((f) => {
          const all = items.filter((i) => i.fasa === f[0]);
          return html`<button type="button" data-fasa="${f[0]}" aria-pressed="${f[0] === fasa}">${f[1]} ${all.filter((i) => i.done).length}/${all.length}</button>`;
        })}</div>
        ${groups.length ? groups.map((g) => html`<section class="panel um-group">
          <div class="um-group__head"><h3>${g[0][1]}</h3><span class="um-count">${g[1].filter((i) => i.done).length}/${g[1].length}</span></div>
          <div>${g[1].map((i) => html`<div class="um-row ${i.done ? 'is-done' : ''}">
            <input type="checkbox" id="cb-${i.id}" data-tick="${i.id}" ${i.done ? raw('checked') : ''}>
            <label class="um-row__body" for="cb-${i.id}"><span class="um-row__title">${i.perkara}</span>
              ${i.catatan ? html`<span class="um-row__note">${i.catatan}</span>` : ''}
              ${i.tarikhSasar && !i.done ? html`<span class="um-row__date ${i.tarikhSasar === today ? 'is-today' : ''}">${i.tarikhSasar === today ? 'Hari ini' : (i.tarikhSasar < today ? 'Lewat · ' : 'Sasaran · ') + fmtDate(i.tarikhSasar)}</span>` : ''}</label>
            <button class="icon-btn" data-edit="${i.id}" aria-label="Sunting ${i.perkara}">${icon('edit', 'i-sm')}</button></div>`)}</div></section>`)
          : html`<div class="panel">${empty('Tiada item dalam fasa ini', 'Tambah item sendiri jika perlu.')}</div>`}
      </div>`.s;
    };
    const load = async () => {
      try { await KD.api.swr('umrah.semak.list', {}, (d) => { data = withQueued(d); draw(); }); } catch (err) { box.innerHTML = errorState(err, 'reload').s; }
    };
    const form = (i) => openForm({
      title: i ? 'Sunting item' : 'Tambah item', id: i && i.id, action: 'umrah.semak.save', delAction: 'umrah.semak.delete', done: load,
      body: html`${field('s-perkara', 'Perkara', html`<input class="input" id="s-perkara" name="perkara" maxlength="150" required value="${i ? i.perkara : ''}">`, true)}
        ${field('s-fasa', 'Fasa', html`<select class="select" id="s-fasa" name="fasa">${options(FASA, i ? i.fasa : (fasa || 'SEBELUM'))}</select>`)}
        ${field('s-kumpulan', 'Kumpulan', html`<select class="select" id="s-kumpulan" name="kumpulan">${options(KUMPULAN, i ? i.kumpulan : 'LAIN')}</select>`)}
        ${field('s-tarikh', 'Tarikh sasaran', html`<input class="input" type="date" id="s-tarikh" name="tarikhSasar" value="${i ? i.tarikhSasar : ''}">`, false,
          data.tarikhBerlepas ? 'Tarikh ini ikut beranjak jika tarikh berlepas diubah.' : '')}
        ${field('s-catatan', 'Catatan', html`<textarea class="textarea" id="s-catatan" name="catatan" maxlength="500" style="min-height:80px">${i ? i.catatan : ''}</textarea>`)}`
    });
    /** Baris peringatan harian dalam bar tarikh berlepas. */
    const remindRow = () => {
      const ps = KD.pwa && KD.pwa.pushState ? KD.pwa.pushState() : 'unconfigured';
      const push = ps === 'on' ? html`<span class="um-remind__push">${icon('check', 'i-sm')} Notifikasi telefon hidup</span>`
        : ps === 'unconfigured' || ps === 'unsupported' ? html`<span class="small muted">Notifikasi dalam app</span>`
        : html`<button class="btn btn-primary btn-sm" data-act="push-on">${icon('bell', 'i-sm')}Hidupkan notifikasi telefon</button>`;
      return html`<div class="um-remind">
        <label class="check"><input type="checkbox" data-remind ${data.peringatan !== false ? raw('checked') : ''}>
          <span><b>Peringatan harian (8 pagi)</b><span class="small muted">Kiraan hari ke Tanah Suci dan persiapan belum siap: H-30, H-21, H-14, kemudian setiap hari dari H-7.</span></span></label>
        <div class="row row-wrap" style="gap:var(--sp-2)">${push}<button class="btn btn-ghost btn-sm" data-act="remind-test">${icon('bell', 'i-sm')}Cuba sekarang</button></div>
      </div>`;
    };
    on(box, 'change', '[data-remind]', async (e, cb) => {
      cb.disabled = true;
      try {
        const r = await call('umrah.peringatan.set', { aktif: cb.checked });
        data.peringatan = r.peringatan; saveSemakCache(data);
        toast(r.peringatan ? 'Peringatan harian dihidupkan.' : 'Peringatan harian dimatikan.');
      } catch (err) { cb.checked = !cb.checked; toastError(err); }
      cb.disabled = false;
    });
    on(box, 'click', '[data-act="push-on"]', async () => { if (KD.pwa && KD.pwa.enablePush) await KD.pwa.enablePush(); draw(); });
    on(box, 'click', '[data-act="remind-test"]', (e, b) => busy(b, async () => {
      try {
        const r = await call('umrah.peringatan.test');
        toast(r.title + '. ' + (r.pushEnabled && r.devices ? 'Dihantar ke telefon dan Notifikasi.' : 'Dihantar ke Notifikasi dalam app.'));
        if (KD.app && KD.app.refreshUnread) KD.app.refreshUnread();
      } catch (err) { toastError(err); }
    }));
    const berlepasForm = () => {
      const lama = data.tarikhBerlepas;
      const m = modal({ title: lama ? 'Ubah tarikh berlepas' : 'Tetapkan tarikh berlepas',
        body: html`<form novalidate>
          ${field('bp-tarikh', 'Tarikh berlepas', html`<input class="input" type="date" id="bp-tarikh" name="tarikhBerlepas" required value="${lama || ''}">`, true,
            'Tarikh sasaran senarai semak (cth. pasport H-5, beg H-2) dikira semula. Item yang anda tetapkan tarikh sendiri tanpa tarikh berlepas tidak diubah.')}
          ${lama ? html`<label class="check mt-3"><input type="checkbox" name="anjakJadual" id="bp-jadual" checked>Anjakkan juga tarikh aktiviti dalam Jadual</label>
            <p class="small muted mt-2" data-beza></p>` : ''}
        </form>`,
        foot: html`<button class="btn btn-outline" data-close>Batal</button><button class="btn btn-primary" data-act="save">Simpan</button>` });
      const form = qs('form', m.el);
      form.addEventListener('submit', (e) => e.preventDefault());
      const beza = qs('[data-beza]', m.el);
      const showBeza = () => {
        const v = qs('#bp-tarikh', m.el).value;
        if (!beza) return;
        if (!v || !lama || v === lama) { beza.textContent = ''; return; }
        const n = Math.round((new Date(v + 'T00:00:00Z') - new Date(lama + 'T00:00:00Z')) / 86400000);
        beza.textContent = (n > 0 ? 'Ditunda ' + n : 'Dipercepat ' + (-n)) + ' hari berbanding ' + fmtDate(lama) + '.';
      };
      qs('#bp-tarikh', m.el).addEventListener('input', showBeza);
      on(m.el, 'click', '[data-act="save"]', (e, b) => busy(b, async () => {
        const v = formData(form);
        try {
          const res = await call('umrah.berlepas.set', { tarikhBerlepas: v.tarikhBerlepas, anjakJadual: !!v.anjakJadual });
          data = res; saveSemakCache(res); m.close(); draw();
          if (res.jadualDianjak && res.bezaHari) {
            const shift = (k) => new Date(new Date(k + 'T00:00:00Z').getTime() + res.bezaHari * 86400000).toISOString().slice(0, 10);
            KD.api.cachePatch('umrah.jadual.list', {}, (j) => ({ items: (j.items || []).map((x) => Object.assign({}, x, { tarikh: x.tarikh ? shift(x.tarikh) : x.tarikh })) }));
          }
          toast('Tarikh berlepas: ' + fmtDate(res.tarikhBerlepas) + '. ' + res.dianjak + ' tarikh sasaran dikemas kini' + (res.jadualDianjak ? ', ' + res.jadualDianjak + ' aktiviti jadual dianjak.' : '.'));
        } catch (err) { if (!fieldErrors(form, err)) toastError(err); }
      }));
    };
    on(box, 'click', '[data-act="berlepas"]', () => berlepasForm());
    on(box, 'click', '[data-fasa]', (e, b) => { fasa = b.getAttribute('data-fasa'); KD.router.setQuery({ tab: 'semak', fasa }); draw(); });
    on(box, 'click', '[data-act="reload"]', load);
    on(box, 'click', '[data-act="add"]', (e) => { e.preventDefault(); form(null); });
    on(box, 'click', '[data-edit]', (e, b) => form(data.items.filter((x) => x.id === b.getAttribute('data-edit'))[0]));
    on(box, 'click', '[data-act="seed"]', (e, b) => busy(b, async () => {
      try {
        const d = qs('#um-berlepas', box).value;
        data = await call('umrah.semak.seed', d ? { tarikhBerlepas: d } : {}); saveSemakCache(data);
        toast(data.total + ' item ditambah.'); fasa = ''; draw();
      } catch (err) { toastError(err); }
    }));
    on(box, 'change', '[data-tick]', async (e, cb) => {
      const id = cb.getAttribute('data-tick');
      cb.disabled = true;
      try {
        const r = await KD.api.callOrQueue('umrah.semak.toggle', { id, done: cb.checked });
        const it = data.items.filter((x) => x.id === id)[0];
        const next = r.queued ? cb.checked : r.data.done;
        if (it.done !== next) data.done += next ? 1 : -1;
        if (r.queued) { it.done = next; toast('Luar talian: disimpan dalam telefon, akan disegerakkan apabila ada internet.'); }
        else Object.assign(it, r.data);
        saveSemakCache(withQueued(data)); draw();
      } catch (err) { cb.checked = !cb.checked; cb.disabled = false; toastError(err); }
    });
    box.innerHTML = skeletonList(4).s;
    await load();
  }

  /* ---- Kaunter Tawaf & Sa'ie (luar talian, disimpan dalam telefon) ---- */
  const uid = () => { const u = KD.auth.user(); return (u && u.id) || 'anon'; };
  const ktrKey = () => 'kd.ktr1.' + uid();
  const ktrLoad = () => { try { return Object.assign({ mode: 'TAWAF', TAWAF: 0, SAIE: 0 }, JSON.parse(localStorage.getItem(ktrKey()) || '{}')); } catch (e) { return { mode: 'TAWAF', TAWAF: 0, SAIE: 0 }; } };
  const ktrSave = (s) => { try { localStorage.setItem(ktrKey(), JSON.stringify(s)); } catch (e) { /* storan penuh */ } };
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
      if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) { wakeLock = null; }
  }
  window.addEventListener('hashchange', () => { if (location.hash.indexOf('tab=kaunter') < 0) keepAwake(false); });
  const buzz = (p) => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* abaikan */ } };
  const AR_BISMILLAH = 'بِسْمِ اللهِ وَاللهُ أَكْبَرُ';
  const AR_RABBANA = 'رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ';
  const AR_SAFA = 'إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ';
  const SEMAK_DONE = { TAWAF: 'Tawaf 7 pusingan', SAIE: 'Sa\'ie 7 kali Safa ke Marwah' };

  function kaunter(box) {
    let st = ktrLoad();
    let lastTap = 0;
    const draw = () => {
      const m = st.mode, n = st[m], done = n >= 7;
      const pct = Math.round((n / 7) * 100);
      const dir = m === 'SAIE' ? (done ? 'Selesai di Marwah' : ((n % 2 === 0) ? 'Safa → Marwah' : 'Marwah → Safa')) : (done ? 'Tawaf selesai' : 'Pusingan ' + (n + 1));
      const hint = m === 'TAWAF' ? 'Tekan setiap kali melintasi garisan Hajarul Aswad' : 'Tekan setiap kali sampai di ' + (n % 2 === 0 ? 'Marwah' : 'Safa');
      const guide = m === 'TAWAF'
        ? html`<div class="um-doa"><strong>Setiap pusingan</strong><span class="small muted">Bila menghadap Hajarul Aswad, angkat tangan (isyarat) dan sebut:</span>
            <p class="um-ar" lang="ar">${AR_BISMILLAH}</p><p class="um-rumi">Bismillahi wallahu akbar.</p>
            <span class="small muted">Antara Rukun Yamani dan Hajarul Aswad:</span><p class="um-ar" lang="ar">${AR_RABBANA}</p>
            <p class="um-rumi">Rabbana atina fid-dunya hasanah, wa fil-akhirati hasanah, wa qina 'adhaban-nar.</p>
            ${n < 3 ? html`<span class="small muted">Lelaki: ramal (berjalan cepat, langkah dekat) pada 3 pusingan pertama.</span>` : ''}
            <span class="small muted">Selebihnya berdoalah dengan hajat sendiri, dalam bahasa yang anda fahami.</span></div>`
        : html`<div class="um-doa">${n === 0 ? html`<strong>Mula di Safa</strong><span class="small muted">Ketika naik ke Safa pada permulaan Sa'ie, bacalah:</span><p class="um-ar" lang="ar">${AR_SAFA}</p>
              <p class="um-rumi">Innas-Safa wal-Marwata min sha'a'irillah.</p>` : ''}
            <span class="small muted">Lelaki: berlari-lari anak di antara dua lampu hijau.</span>
            <span class="small muted">Di Safa dan Marwah, hadap Kaabah dan berdoalah dengan hajat sendiri. Ini juga masa yang baik untuk titipan doa keluarga.</span></div>`;
      box.innerHTML = html`<div class="um-stack" style="max-width:560px;margin:0 auto">
        <div class="segmented" role="group" aria-label="Jenis" style="align-self:center">
          <button type="button" data-ktr-mode="TAWAF" aria-pressed="${m === 'TAWAF'}">Tawaf ${st.TAWAF}/7</button>
          <button type="button" data-ktr-mode="SAIE" aria-pressed="${m === 'SAIE'}">Sa'ie ${st.SAIE}/7</button></div>
        <section class="panel um-ktr ${done ? 'um-ktr__done' : ''}">
          <span class="um-ktr__dir">${dir}</span>
          <button class="um-ktr__btn" type="button" data-ktr="+1" style="--p:${pct}" ${done ? raw('disabled') : ''} aria-label="${done ? 'Selesai' : 'Tambah satu pusingan'}">
            <span><span class="um-ktr__num">${n}/7</span><span class="um-ktr__sub">${done ? 'Alhamdulillah' : 'Tekan +1'}</span></span></button>
          <span class="small muted">${done ? (m === 'TAWAF' ? 'Seterusnya: solat sunat Tawaf 2 rakaat, kemudian minum Zamzam.' : 'Seterusnya: tahallul (bercukur / bergunting).') : hint}</span>
          <div class="row row-wrap"><button class="btn btn-outline btn-sm" data-ktr="-1" ${n ? '' : raw('disabled')}>${icon('chev-left', 'i-sm')}Undur 1</button>
            <button class="btn btn-ghost btn-sm" data-ktr="reset" ${n ? '' : raw('disabled')}>${icon('refresh', 'i-sm')}Mula semula</button>
            ${done ? html`<button class="btn btn-primary btn-sm" data-ktr="semak">${icon('check', 'i-sm')}Tanda dalam senarai semak</button>` : ''}</div>
        </section>
        <section class="panel">${guide}</section>
        <p class="small muted" style="margin:0">Kiraan disimpan dalam telefon ini dan kekal walaupun app ditutup. Skrin dikekalkan hidup semasa halaman ini dibuka (jika telefon menyokong). Ikut bimbingan mutawwif anda.</p>
      </div>`.s;
    };
    on(box, 'click', '[data-ktr-mode]', (e, b) => { st.mode = b.getAttribute('data-ktr-mode'); ktrSave(st); draw(); });
    on(box, 'click', '[data-ktr]', async (e, b) => {
      const a = b.getAttribute('data-ktr');
      const m = st.mode;
      if (a === '+1') {
        if (Date.now() - lastTap < 1500) return; /* elak tertekan dua kali dalam kesesakan */
        lastTap = Date.now();
        st[m] = Math.min(7, st[m] + 1); ktrSave(st); buzz(st[m] >= 7 ? [200, 100, 200] : 60); draw();
      } else if (a === '-1') { st[m] = Math.max(0, st[m] - 1); ktrSave(st); draw(); }
      else if (a === 'reset') {
        if (!(await confirm({ title: 'Mula semula ' + (m === 'TAWAF' ? 'Tawaf' : 'Sa\'ie') + '?', message: 'Kiraan akan kembali ke 0.', confirmText: 'Mula semula' }))) return;
        st[m] = 0; ktrSave(st); draw();
      } else if (a === 'semak') {
        const hit = KD.api.cacheGet('umrah.semak.list', {});
        const item = hit && hit.d && hit.d.items ? hit.d.items.filter((i) => i.perkara === SEMAK_DONE[m])[0] : null;
        if (!item) { toast('Item "' + SEMAK_DONE[m] + '" tiada dalam senarai semak anda.'); return; }
        if (item.done) { toast('Sudah ditanda dalam senarai semak.'); return; }
        try {
          const r = await KD.api.callOrQueue('umrah.semak.toggle', { id: item.id, done: true });
          KD.api.cachePatch('umrah.semak.list', {}, (d) => { d.items.forEach((i) => { if (i.id === item.id) i.done = true; }); d.done = d.items.filter((i) => i.done).length; return d; });
          toast(r.queued ? 'Ditanda dalam telefon; akan disegerakkan apabila ada internet.' : 'Ditanda dalam senarai semak.');
        } catch (err) { toastError(err); }
      }
    });
    draw();
    keepAwake(true);
  }

  /* ---- Kad maklumat penting (dalam telefon sahaja) ---- */
  const kadKey = () => 'kd.kad1.' + uid();
  const kadLoad = () => { try { return JSON.parse(localStorage.getItem(kadKey()) || 'null'); } catch (e) { return null; } };
  const KAD_FIELDS = [
    ['h', 'Diri'], ['nama', 'Nama (seperti pasport)'], ['pasport', 'No. pasport'], ['visa', 'No. visa'], ['agensi', 'Agensi / no. kumpulan'],
    ['h', 'Mutawwif'], ['mutawwifNama', 'Nama mutawwif'], ['mutawwifTel', 'Telefon mutawwif', 'tel'],
    ['h', 'Hotel Makkah'], ['makkahNama', 'Nama hotel'], ['makkahArab', 'Nama / alamat dalam tulisan Arab (untuk pemandu)', 'ar'], ['makkahBilik', 'No. bilik'],
    ['h', 'Hotel Madinah'], ['madinahNama', 'Nama hotel'], ['madinahArab', 'Nama / alamat dalam tulisan Arab (untuk pemandu)', 'ar'], ['madinahBilik', 'No. bilik'],
    ['h', 'Insurans'], ['insSyarikat', 'Syarikat'], ['insPolisi', 'No. polisi'], ['insTel', 'Talian kecemasan insurans', 'tel'],
    ['h', 'Kecemasan'], ['kecNama', 'Waris (nama & hubungan)'], ['kecTel', 'Telefon waris', 'tel'], ['perubatan', 'Catatan perubatan (alahan, ubat)', 'text']
  ];
  const SOS = [['911', 'Kecemasan'], ['997', 'Ambulans'], ['999', 'Polis'], ['998', 'Pertahanan Awam']];

  function kad(box) {
    let k = kadLoad();
    const telLink = (v) => html`<a href="tel:${String(v).replace(/[^0-9+]/g, '')}">${v}</a>`;
    const row = (lbl, v, type) => (v ? html`<dt>${lbl}</dt><dd>${type === 'tel' ? telLink(v) : v}</dd>` : '');
    const showAr = (title, nama, ar) => {
      modal({ title: title, wide: true, body: html`<div class="um-stack" style="text-align:center">${nama ? html`<strong style="font-size:var(--fs-xl)">${nama}</strong>` : ''}<p class="um-big-ar" lang="ar">${ar}</p>
        <p class="small muted">Tunjukkan skrin ini kepada pemandu teksi.</p></div>`, foot: html`<button class="btn btn-primary" data-close>Tutup</button>` });
      keepAwake(true);
    };
    const draw = () => {
      if (!k) {
        box.innerHTML = html`<section class="panel"><div class="um-start"><div><h3>Kad maklumat penting</h3>
          <p class="muted mt-2">Simpan nombor pasport, hotel (termasuk tulisan Arab untuk pemandu teksi), mutawwif, insurans dan kontak kecemasan dalam satu skrin. Boleh dibuka tanpa internet.</p>
          <p class="small muted">Disimpan dalam telefon ini sahaja, tidak dihantar ke pelayan.</p></div>
          <div><button class="btn btn-primary" data-act="kad-edit">${icon('edit')}Isi kad</button></div></div></section>
          <section class="panel"><h3 style="margin-top:0">Nombor kecemasan Arab Saudi</h3><div class="um-sos mt-3">${SOS.map((s) => html`<a href="tel:${s[0]}"><b>${s[0]}</b><span>${s[1]}</span></a>`)}</div></section>`.s;
        return;
      }
      box.innerHTML = html`<div class="um-stack">
        <div class="row spread row-wrap"><p class="small muted um-note" style="margin:0">${icon('lock', 'i-sm')} Disimpan dalam telefon ini sahaja · boleh dibuka tanpa internet</p>
          <button class="btn btn-outline btn-sm" data-act="kad-edit">${icon('edit', 'i-sm')}Sunting</button></div>
        <div class="um-kad">
          <section class="panel"><h3>${icon('user', 'i-sm')}Diri</h3><dl class="um-kv">${row('Nama', k.nama)}${row('Pasport', k.pasport)}${row('Visa', k.visa)}${row('Agensi', k.agensi)}</dl></section>
          <section class="panel"><h3>${icon('users', 'i-sm')}Mutawwif</h3><dl class="um-kv">${row('Nama', k.mutawwifNama)}${row('Telefon', k.mutawwifTel, 'tel')}</dl></section>
          ${['makkah', 'madinah'].map((c) => html`<section class="panel"><h3>${icon(c === 'makkah' ? 'kaaba' : 'mosque', 'i-sm')}Hotel ${c === 'makkah' ? 'Makkah' : 'Madinah'}</h3>
            <dl class="um-kv">${row('Hotel', k[c + 'Nama'])}${row('Bilik', k[c + 'Bilik'])}</dl>
            ${k[c + 'Arab'] ? html`<p class="um-ar mt-3" lang="ar">${k[c + 'Arab']}</p><button class="btn btn-primary btn-sm mt-3" data-ar="${c}">${icon('eye', 'i-sm')}Tunjuk kepada pemandu</button>` : ''}</section>`)}
          <section class="panel"><h3>${icon('shield', 'i-sm')}Insurans</h3><dl class="um-kv">${row('Syarikat', k.insSyarikat)}${row('No. polisi', k.insPolisi)}${row('Talian', k.insTel, 'tel')}</dl></section>
          <section class="panel"><h3>${icon('alert', 'i-sm')}Kecemasan</h3><dl class="um-kv">${row('Waris', k.kecNama)}${row('Telefon', k.kecTel, 'tel')}${row('Perubatan', k.perubatan)}</dl></section>
        </div>
        <section class="panel"><h3 style="margin-top:0">Nombor kecemasan Arab Saudi</h3><div class="um-sos mt-3">${SOS.map((s) => html`<a href="tel:${s[0]}"><b>${s[0]}</b><span>${s[1]}</span></a>`)}</div></section>
      </div>`.s;
    };
    const edit = () => {
      const v = k || { nama: (KD.auth.user() || {}).fullName || '' };
      const m = modal({ title: 'Kad maklumat penting', wide: true, body: html`<form novalidate class="um-form-grid">${KAD_FIELDS.map((f) => (f[0] === 'h' ? html`<h4>${f[1]}</h4>`
          : html`<div class="field ${f[2] === 'ar' || f[2] === 'text' ? 'span2' : ''}"><label class="label" for="kd-${f[0]}">${f[1]}</label>${f[2] === 'ar' || f[2] === 'text'
            ? html`<textarea class="textarea" id="kd-${f[0]}" name="${f[0]}" maxlength="300" style="min-height:70px" ${f[2] === 'ar' ? raw('dir="rtl" lang="ar"') : ''}>${v[f[0]] || ''}</textarea>`
            : html`<input class="input" id="kd-${f[0]}" name="${f[0]}" maxlength="120" ${f[2] === 'tel' ? raw('type="tel" inputmode="tel"') : ''} value="${v[f[0]] || ''}">`}</div>`))}
          <p class="small muted span2">Salin nama/alamat hotel dalam tulisan Arab daripada surat agensi atau tempahan hotel. Data ini tidak dihantar ke pelayan.</p></form>`,
        foot: html`${k ? html`<button class="btn btn-ghost" data-act="kad-del" style="margin-right:auto">${icon('trash', 'i-sm')}Padam</button>` : ''}<button class="btn btn-outline" data-close>Batal</button><button class="btn btn-primary" data-act="kad-save">Simpan</button>` });
      on(m.el, 'click', '[data-act="kad-save"]', () => {
        const d = formData(qs('form', m.el));
        Object.keys(d).forEach((x) => { d[x] = String(d[x] || '').trim(); });
        try { localStorage.setItem(kadKey(), JSON.stringify(d)); k = d; m.close(); draw(); toast('Kad disimpan dalam telefon ini.'); } catch (e) { toast('Gagal menyimpan dalam telefon ini.', 'error'); }
      });
      on(m.el, 'click', '[data-act="kad-del"]', async () => {
        m.close();
        if (!(await confirm({ title: 'Padam kad?', message: 'Maklumat kad akan dibuang daripada telefon ini.', confirmText: 'Padam', danger: true }))) return;
        try { localStorage.removeItem(kadKey()); } catch (e) { /* abaikan */ }
        k = null; draw();
      });
    };
    on(box, 'click', '[data-act="kad-edit"]', edit);
    on(box, 'click', '[data-ar]', (e, b) => { const c = b.getAttribute('data-ar'); showAr('Hotel ' + (c === 'makkah' ? 'Makkah' : 'Madinah'), k[c + 'Nama'], k[c + 'Arab']); });
    draw();
  }

  const RENDER = { semak, kaunter, kad, belanja, jadual, titipan, panduan };

  KD.views.umrah = {
    async render(el, params, query) {
      const tab = RENDER[query.tab] ? query.tab : 'semak';
      el.innerHTML = html`<div class="page-head"><div><h1>Planner Umrah</h1><p>Persiapan, perbelanjaan, jadual dan titipan doa dalam satu tempat.</p></div></div>
        <div class="segmented um-tabs" role="tablist" aria-label="Bahagian">${TABS.map((t) => html`<button type="button" role="tab" data-tab="${t[0]}" aria-pressed="${t[0] === tab}" aria-selected="${t[0] === tab}">${t[2]}</button>`)}</div>
        <div data-um-body></div>`.s;
      on(el, 'click', '[data-tab]', (e, b) => KD.router.go('/umrah?tab=' + b.getAttribute('data-tab')));
      await RENDER[tab](qs('[data-um-body]', el), query);
    }
  };

  /** Lukis kad Planner Umrah di Utama daripada ringkasan {total, done, tarikhBerlepas}. */
  KD.views.umrahDashPaint = function (box, d) {
    if (!box || !d) return;
    const pct = d.total ? Math.round((100 * d.done) / d.total) : 0;
    box.innerHTML = html`<section class="panel um-dash">${icon('kaaba')}
      <div class="um-dash__body"><strong>Planner Umrah</strong>${d.total
        ? html`${d.tarikhBerlepas ? html`<div class="um-trip__count">${icon('plane', 'i-sm')} ${fmtDate(d.tarikhBerlepas)} · ${countdown(d.tarikhBerlepas)}</div>` : ''}<div class="small muted">${fmtNum(d.done)} daripada ${fmtNum(d.total)} persiapan siap (${pct}%)</div><div class="um-track"><span style="width:${pct}%"></span></div>`
        : html`<div class="small muted">Senarai semak, perbelanjaan, jadual dan panduan Umrah.</div>`}</div>
      <a class="btn btn-outline btn-sm" href="#/umrah">${d.total ? 'Buka' : 'Mula'}</a></section>`.s;
  };

  /** Kad ringkas di Utama (muat sendiri) — dikekalkan untuk keserasian. */
  KD.views.umrahDashCard = async function (box) {
    if (!box) return;
    try { const d = await call('umrah.semak.list'); KD.views.umrahDashPaint(box, d); } catch (e) { box.innerHTML = ''; }
  };
})(window.KD);
</script>
